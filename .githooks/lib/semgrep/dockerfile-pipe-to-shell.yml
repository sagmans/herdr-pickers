# Vendored rule for the generic pre-push SAST check (lib/checks/sast.sh).
# Copied from the shared hook template. Own rules instead of the
# Semgrep registry: the push gate needs no network, gives the same result on
# every machine, and carries no third-party rule license. Each rule targets a
# high-signal pattern and skips literal arguments to keep false positives low.
# Covers: Dockerfile downloads piped to a shell.
# Fixtures: tests/semgrep/ in the shared hook template repository.
rules:
  - id: dockerfile-pipe-to-shell
    languages: [dockerfile]
    severity: ERROR
    message: >-
      A download is piped straight into a shell during the image build, so
      whatever the server sends runs unchecked. Download to a file, verify a
      checksum, then run it.
    metadata:
      cwe: "CWE-494"
    pattern-regex: '(?<![A-Za-z0-9_.-])(curl|wget)\b[^|\n]*\|\s*(sudo\s+(-\S+\s+)*)?(env\s+)?(/usr)?(/bin/)?(ba|z|da|k)?sh\b'
