name: smoke

# On-demand PTY smoke only: proves the plugin inside a real, disposable Herdr
# runtime on both declared platforms without complicating PR CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: bun install --frozen-lockfile
      - run: bun run smoke
