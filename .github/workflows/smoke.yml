name: smoke

# On-demand PTY smoke only: proves the plugin inside a real, disposable Herdr
# runtime on both declared platforms and across the declared Herdr version
# range without complicating PR CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        # The declared floor (0.8.0) ships the same binary as 0.8.2, so 0.8.2
        # is the oldest distinct runtime that can be exercised.
        herdr: ["0.8.2", "0.9.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes or fetches remotely, so the token must not persist in .git/config.
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - run: mise install herdr@${{ matrix.herdr }}
      - run: echo "$(mise where herdr@${{ matrix.herdr }})" >> "$GITHUB_PATH"
      - run: herdr --version
      - run: bun run smoke
